<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="top-nav.css" />
    <link rel="stylesheet" href="login.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="index.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-sm custom-nav text-light">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" onclick="buildContactLink()">Registration</a>
        </li>
        <li class="nav-item" onclick="buildLoginLink()">
          <a class="nav-link">Login</a>
        </li>
      </ul>
    </nav>
    <div class="container">
      <div class="register-container">
        <div class="login-content">
          <h2>Welcome</h2>
          <p>Register and Sign Up</p>
          <form action="/login" method="post">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" required />
            </div>

            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" required />
            </div>

            <div class="form-group">
              <label for="phonenumber">Phone Number</label>
              <input type="text" id="phonenumber" name="phonenumber" required />
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required />
            </div>
            <div class="form-group">
              <label for="password">Confirm Password</label>
              <input
                type="password"
                id="Confirmpassword"
                name="password"
                required
              />
            </div>
          </form>

          <button class="btn btn-secondary" onclick="register() ">
            Register
          </button>

          <div class="or">
            <span>or</span>
          </div>
          <button class="google-btn">
            Continue with Google
            <i class="fa-brands fa-google"></i>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
