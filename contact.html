<!DOCTYPE html>
<html lang="en">
  <head>
    <title>To Do list</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="top-nav.css" />
    <link rel="stylesheet" href="login.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="index.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="custom-signup">
        <div class="singup-content">
          <div class="text-dark">
            <form
              target="_blank"
              method="post"
              autocomplete="on"
              class="needs-validation"
            >
              <div class="names">
                <h1>
                  <span style="font-size: 40px">&#128233;</span>
                  Have Questions? or
                  <span style="font-size: 40px">&#128172;</span>
                  Need Advice?
                </h1>
                <br />
                <h2>Just a message away....</h2>
                <input
                  type="text"
                  id="name"
                  class="custom-field"
                  placeholder="Your name"
                  required
                /><br />
                <input
                  type="tel"
                  id="Phone-Number"
                  class="custom-field"
                  placeholder="Enter Your Phone Number"
                  required
                /><br />
              </div>
              <div class="date">
                <input
                  type="date"
                  id="date"
                  class="custom-field"
                  required
                /><br />
              </div>
              <div class="time">
                <input
                  type="time"
                  id="time"
                  class="custom-field"
                  required
                /><br />
              </div>
              <div class="description">
                <textarea
                  class="custom-field"
                  rows="5"
                  id="Description"
                  placeholder="Enter brief description"
                  name="text"
                  required
                ></textarea>
              </div>
              <input
                type="hidden"
                id="order-number"
                name="order number"
                value="2"
              />
              <div class="form-check custom-form-check mb-3">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="myCheck"
                  name="terms"
                  required
                />
                <label class="form-check-label" for="myCheck"
                  >I have read the terms and conditions.</label
                >
              </div>
              <div class="action-buttons">
                <button
                  class="btn btn-primary"
                  type="button"
                  onclick="sendRequest()"
                >
                  Send Request
                </button>
                <button class="btn btn-danger btn-custom" type="reset">
                  Reset
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
